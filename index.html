/* ============================================================
   BARBER & BEAUTY PRO  ·  CREATIVE DIRECTION 02
   Preserves approved signature: silver B, red pole stripes,
   scissors and comb; charcoal surfaces and functional green.
   This is a UI refinement, not a new brand identity.
   ============================================================ */
:root {
  --bg:#0d0e10; --sidebar:#111416; --panel:#1b1f22; --panel2:#15181a;
  --text:#f5f6f7; --muted:#a5adb4; --stroke:#30363a;
  --red:#d9192e; --redDark:#ad1426; --green:#47d575;
  --greenSoft:rgba(71,213,117,.105); --r:13px;
  font-family:"Avenir Next","Inter","Segoe UI",Arial,sans-serif;
}
body{background:#0d0e10;color:var(--text);letter-spacing:-.05px}
.app{min-height:100vh}
.sidebar{flex-basis:272px;background:#121517;border-right:1px solid #292f33}
.brand{padding:22px 18px 22px 15px;gap:10px;align-items:center;min-height:119px;border-bottom:1px solid #292e31;background:linear-gradient(145deg,#1a1d1f,#121517 75%)}
.brand-icon-frame{flex:none;width:73px;height:78px;display:grid;place-items:center;filter:drop-shadow(0 4px 9px #0009)}
.brandmark{width:68px;height:77px;object-fit:contain}
.brand-name{min-width:0}
.brand strong{display:block;line-height:1.23;white-space:normal;letter-spacing:-.45px;font-size:15px;font-weight:800;color:#f2f3f3}
.brand strong em{color:#f32a42}
.brand-name span{color:#92999f;display:block;margin-top:7px;letter-spacing:.25px;font-size:11px}
.brand-name span b{color:#d9dcdf;font-weight:750}
.menu-heading{display:none}
.tenant-tag{margin:20px 16px 17px;padding:15px 15px 14px;border-radius:11px;background:#1b2022;border:1px solid #323b3f;line-height:1.5;font-size:12px;box-shadow:inset 0 1px 0 #ffffff04}
.tenant-tag .pulse{width:7px;height:7px;box-shadow:0 0 0 4px rgba(70,211,109,.075)}
.tenant-tag small{margin:4px 0 0 16px;font-size:11px;letter-spacing:.08px}
#nav{padding:3px 11px 10px;display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3d4448 transparent}
.nav-group+.nav-group{margin-top:13px}
.nav-caption{font-size:9px;letter-spacing:1.65px;color:#6f7a82;font-weight:800;padding:11px 15px 9px}
.nav-item{position:relative;gap:13px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;font-size:12.5px;font-weight:650;letter-spacing:.02px;color:#afb6bb;transition:background .14s ease,color .14s ease}
.nav-item .ico{display:flex;align-items:center;justify-content:center;width:21px;height:21px;flex:none;color:#8f979d}
.nav-item .ico svg{width:18px;height:18px}
.nav-item.active{background:linear-gradient(100deg,#a81226,#d71931);color:#fff;box-shadow:0 4px 15px #c013261e,inset 0 1px 0 #ffffff24}
.nav-item.active .ico{color:#fff}
.nav-item:hover:not(.active){background:#252a2d;color:#fff}
.nav-indicator{display:none}
.sidebar-foot{margin:auto 19px 21px;padding-top:15px;border-top:1px solid #2d3337;font-size:11px;color:#bdc2c5}
.side-foot-head{font-weight:600}
.sidebar-foot small{padding-top:9px;color:#838d94;font-size:10px}
.side-footer-brand{font-size:8px;font-weight:800;letter-spacing:1.35px;color:#666f75;margin:19px 0 0 2px}
.side-footer-brand span{font-weight:500;color:#545f67}
.main{background:radial-gradient(ellipse at 100% -15%,rgba(56,62,67,.13),transparent 34%),#0d0e10}
.topbar{height:73px;border-bottom:1px solid #272b2f;background:rgba(16,18,20,.95);padding:0 36px}
.topbar-left{font-size:12px;gap:16px}
.topbar-left .crumb{font-weight:760;color:#e9ecee;letter-spacing:.02px}
.topbar-left #crumbCurrent{color:#a3abb1}
.topbar .divider-v{background:#343a3e;height:16px}
.topbar-right{gap:20px}
.mode-pill{font-size:9px;letter-spacing:.85px;color:#ffc2c8;border:1px solid #78313b;background:#301b1f;padding:8px 12px;border-radius:7px}
.avatar{border:1px solid #4b5156;background:linear-gradient(135deg,#3d4147,#22282d);font-size:11px;width:36px;height:36px;box-shadow:inset 0 1px 0 #ffffff26}
.content{max-width:1590px;padding:34px 38px 72px}
.headline{margin-bottom:26px;align-items:flex-end;gap:20px}
.eyebrow{color:#929ba2;display:flex;align-items:center;gap:9px;letter-spacing:1.65px;font-size:9px;font-weight:820;margin-bottom:11px}
.eyebrow-line{width:18px;height:2px;background:#db1d33;display:block}
.headline h1{font-size:30px;font-weight:760;letter-spacing:-1.15px;line-height:1.1}
.headline p{font-size:12px;color:#9da6ac;margin-top:10px;line-height:1.5}
.btn{font-size:12px;min-height:39px;font-weight:720;padding:10px 16px;border-radius:9px;box-shadow:inset 0 1px 0 #ffffff09;transition:transform .16s ease,background .16s ease,border .16s ease}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn-red{background:linear-gradient(180deg,#f0243b,#cf1029 92%);border:1px solid #f23047;color:#fff;box-shadow:0 5px 18px #c610271a,inset 0 1px 0 #ffffff3d}
.btn-red:hover{background:linear-gradient(180deg,#ff3048,#d1132b)}
.btn-ghost{background:#1b1e20;border:1px solid #373d41}
.btn-sm{min-height:32px}
.icon-button{border-color:#3a4044;background:#202528;border-radius:9px}
:where(button,input,select,textarea):focus-visible{outline:2px solid #ff6474;outline-offset:3px}
.surface{background:linear-gradient(155deg,#202427 0%,#1b1f22 60%,#1a1d1f 100%);border:1px solid #33393d;border-radius:13px;box-shadow:0 12px 35px -24px #000e,inset 0 1px 0 #ffffff09}
.page-notice{display:flex;align-items:center;gap:13px;padding:12px 15px;border:1px solid #30383c;border-radius:9px;background:linear-gradient(90deg,#1a1e20,#141719);margin-bottom:21px;color:#a0a9af}
.page-notice strong{font-size:11px;letter-spacing:.12px;color:#e5e8e9;font-weight:720;display:block}
.page-notice span:not(.notice-symbol){font-size:10.5px;line-height:1.4;display:block;margin-top:3px}
.notice-symbol{font-size:12px;width:23px;height:23px;display:grid;place-items:center;flex:none;border:1px solid #505961;border-radius:50%;color:#d1d7da;font-weight:750;font-style:normal}
.kpi-grid{gap:15px;margin-bottom:20px}
.kpi{position:relative;min-height:158px;padding:21px 22px 20px;overflow:hidden;transition:border-color .15s ease,transform .15s ease}
.kpi:hover{border-color:#4d555a;transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,#767c8238,transparent)}
.kpi-head{font-size:11.5px;color:#b5bdc3;gap:12px}
.kpi-icon{width:35px;height:35px;flex:none;display:grid;place-items:center;border-radius:9px;border:1px solid #41474b;background:#292e32;color:#d2d7da}
.kpi-icon svg{width:19px;height:19px}
.kpi-val{font-size:33px;line-height:1.2;letter-spacing:-1.45px;font-weight:780;margin:13px 0 12px}
.kpi-val.money{font-size:31px}
.kpi-bottom{border-top:1px solid #33393b;padding-top:10px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.kpi-note{font-size:10px;line-height:1.4;color:#929da5}
.kpi-tag{font-size:9px;font-weight:650;color:#8ee4a6;white-space:nowrap}
.kpi-tag-muted{color:#aab3b8}
.grid-two{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:18px}
.cardpad{padding:23px 24px}
.section-heading{margin-bottom:18px;align-items:center}
.section-heading h2{font-size:16px;letter-spacing:-.35px;font-weight:760;color:#f5f5f6;margin:7px 0 0}
.section-kicker{color:#849097;letter-spacing:1.4px;font-size:9px;font-weight:800}
.linkish{font-weight:660;font-size:11px;color:#dadee0;letter-spacing:.05px}
.appointment-list{gap:0}
.apt-line{border-bottom:1px solid #33393c;padding:13px 9px 13px 4px;grid-template-columns:87px minmax(0,1fr) auto;min-height:69px}
.apt-line:hover{background:#292f31;border-radius:8px}
.apt-time{color:#e7ebed;font-weight:750;font-size:11.5px}
.apt-title{font-size:12px;color:#eff0f1;font-weight:720}
.apt-desc{font-size:10px;color:#a2abb1;line-height:1.4;margin-top:6px}
.apt-separator{color:#68757c;margin:0 2px}
.badge{font-size:9.5px;font-weight:750;padding:6px 9px;border-radius:6px;letter-spacing:.05px}
.badge.confirmada{background:#1c3826;border-color:#2b6940;color:#8df3a9}
.badge.pendiente{background:#363026;border-color:#675335;color:#efc88b}
.badge.cancelada{background:#3b242b;border-color:#7e3943;color:#ff9ca6}
.analytics-card{min-height:370px}
.analytics-card .subtle{font-size:10px;color:#98a3a9}
.chart-number{display:flex;align-items:baseline;gap:9px;margin:18px 0 4px}
.chart-number strong{font-size:32px;letter-spacing:-1.2px;font-weight:780;color:#f3f4f5}
.chart-number span{color:#929da4;font-size:11px}
.trend-wrapper{margin-top:5px;width:100%;height:228px;overflow:hidden}
.trend-wrapper svg{height:100%;width:100%;overflow:visible}
.chart-foot{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #343a3e;padding-top:15px;color:#89949b;font-size:10px}
.legend-dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:#4bdd7a;margin-right:5px}
/* Other tabs retain the same spacing, hierarchy and surface language. */
.toolbar{margin-bottom:17px;gap:10px}
.field{border-color:#41494d;background:#171b1e;color:#f1f3f4;border-radius:8px;min-height:40px;font-size:12px}
.field::placeholder{color:#88959c}
.calendar-surface{background:#171b1d}
.cal-head{background:#2b3033}
.cal-row{background:#181c1e;border-top-color:#30363a}
.cal-cell{border-right-color:#31373b}
.cal-chip{background:#1e3326;border-color:#315d41}
.cal-chip.pending{background:#332d24}
.cal-caption{padding-top:8px}
.table th{background:#252a2d;border-bottom:1px solid #3b4145;color:#adb6bc}
.table td{border-top-color:#333b3f;padding:15px 18px}
.table tr:hover td{background:#282e31}
.personavatar{background:linear-gradient(145deg,#42484e,#30363a);color:#f5f5f5;border:1px solid #555d63}
.table-action{border-radius:7px;padding:8px 12px}
.staff-card{padding:23px}
.staff-top .personavatar{border-radius:13px}
.staff-meta{border-top-color:#353d40}
.service-tile{padding:21px 23px}
.service-price{color:#f4f5f6}
.setting-card{padding:25px}
.modal{background:#1d2123;border-color:#4b5459;box-shadow:0 35px 100px #000b}
.modal-head{border-bottom-color:#373e42}
@media(max-width:1250px){
 .sidebar{flex-basis:254px}
 .content{padding:29px 27px 62px}
 .kpi{padding:19px 17px}
 .kpi-bottom{align-items:start;flex-direction:column}
 .kpi-val{font-size:29px}
 .kpi-val.money{font-size:27px}
 .grid-two{grid-template-columns:1.1fr 1fr}
}
@media(max-width:990px){
 .grid-two{grid-template-columns:1fr}
 .staff-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .analytics-card{min-height:310px}
}
@media(max-width:760px){
 .sidebar{width:275px;max-width:86vw;box-shadow:12px 0 48px #0009;z-index:10}
 .topbar{padding:0 16px;height:64px}
 .topbar-left .crumb{display:none}
 .topbar .mode-pill{padding:7px 8px;font-size:9px}
 .topbar-right{gap:9px}
 .content{padding:26px 16px 56px}
 .headline{gap:17px;margin-bottom:23px;align-items:flex-start}
 .headline h1{font-size:26px}
 .headline .btnrow{width:100%}
 .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 .kpi{min-height:150px;padding:16px 15px}
 .kpi-head{align-items:flex-start;line-height:1.35}
 .kpi-icon{width:30px;height:30px}
 .kpi-val,.kpi-val.money{font-size:26px}
 .kpi-tag{font-size:8px}
 .cardpad{padding:19px 17px}
 .section-heading h2{font-size:15px}
 .apt-line{grid-template-columns:76px minmax(0,1fr) auto;gap:8px;padding:13px 2px}
 .apt-desc{font-size:10px}
 .badge{font-size:9px;padding:5px 6px}
 .trend-wrapper{height:195px}
 .chart-foot{font-size:9px}
 .staff-grid{grid-template-columns:1fr}
}
@media(max-width:380px){.kpi-grid{grid-template-columns:1fr}.apt-time{font-size:10px}}
@media(prefers-reduced-motion:reduce){.btn,.kpi,.nav-item{transition:none!important}}
.status-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px;border-top:1px solid #323a3e;padding-top:16px}
.status-overview>div{background:#15191b;border:1px solid #333b3e;border-radius:9px;padding:13px 11px 12px}
.status-overview-label{display:flex;gap:7px;align-items:center;white-space:nowrap;font-size:10px;color:#aab3b9}
.status-overview strong{display:block;font-size:21px;font-weight:760;line-height:1;margin-top:12px;letter-spacing:-.5px}
.status-bullet{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.status-bullet.confirmed{background:#4bdd7a}.status-bullet.pending{background:#e6bd79}.status-bullet.canceled{background:#e87080}
@media(max-width:440px){.status-overview{gap:5px}.status-overview>div{padding:10px 7px}.status-overview-label{font-size:9px}.status-overview strong{font-size:18px}}

/* Barber & Beauty Pro · Elite 3D direction based on user-provided concept image.
   Functional prototype: visual styling only; existing business logic remains unchanged. */
:root{
 --bg:#090a0b;--sidebar:#090a0c;--panel:#18191b;--panel2:#101112;
 --text:#f8f8f9;--muted:#bac0c5;--stroke:#57595d;
 --red:#d70017;--redDark:#96010f;--green:#42ed34;--greenSoft:#12310e;
 --yellow:#f5cf68;--gold:#f4cb69;--goldDark:#a66a1d;--r:17px;
 font-family:"Avenir Next","Inter","Segoe UI",Arial,sans-serif
}
body{background:#090a0b;color:#f7f7f7}
.app{background:#09090a;min-height:100vh}
.sidebar{flex:0 0 290px;width:290px;background:linear-gradient(150deg,#191c20 0%,#08090a 28%,#050608 89%,#16191b 100%);border-right:1px solid #4b4d4f;box-shadow:7px 0 24px #000a, inset -1px 0 0 #0009;overflow:hidden}
.sidebar::before{content:"";position:absolute;left:0;top:0;width:109px;height:112px;pointer-events:none;z-index:1;background:linear-gradient(135deg,#f9dc85,#8e4f12 48%,#ffdc87 52%,transparent 54%);clip-path:polygon(0 0,100% 0,0 100%);filter:drop-shadow(3px 4px 7px #f6af3e99)}
.sidebar::after{content:"";position:absolute;bottom:0;right:0;width:70px;height:85px;pointer-events:none;background:linear-gradient(135deg,transparent 48%,#9f641e 50%,#ffd987 52%,#ad6c18 54%,transparent 56%);opacity:.7}
.elite-brand{position:relative;display:flex;flex-direction:column;gap:0;min-height:217px;padding:7px 15px 11px;justify-content:center;border-bottom:1px solid #a3762e;background:radial-gradient(ellipse at 50% 22%,#31353b 0%,#111315 64%,#070809 100%);box-shadow:0 10px 25px #000c,inset 0 -2px 0 #4c3014}
.elite-brand .brand-icon-frame{width:180px;height:139px;margin:auto;filter:drop-shadow(0 6px 6px #000) drop-shadow(0 0 9px #d9952c55)}
.elite-brand .brandmark{width:180px;height:139px;object-fit:contain;filter:brightness(1.12) contrast(1.13)}
.elite-brand .brand-name{text-align:center;width:100%;margin-top:-8px;text-shadow:0 2px 2px black}
.elite-brand .brand-name strong{font-family:Georgia,"Times New Roman",serif;font-size:19px;color:#ececed;letter-spacing:.5px;font-weight:400;line-height:1.05;white-space:nowrap}
.elite-brand .brand-pro{display:block!important;font-family:Georgia,"Times New Roman",serif;font-size:27px!important;color:#f5ce71!important;letter-spacing:2.5px;margin:2px auto -3px!important;line-height:1!important;font-style:italic;font-weight:700;text-shadow:0 1px 0 #ffe5a0,0 3px 4px #000}
.elite-brand .brand-subtitle{font-size:8px!important;letter-spacing:3.2px!important;color:#b9b9b9!important;display:block!important;margin-top:6px!important;text-transform:uppercase}
.tenant-tag{margin:16px 17px 11px;padding:12px 16px;border-radius:15px;background:linear-gradient(160deg,#272a2f 0%,#101113 78%);border:1px solid #78797a;box-shadow:inset 0 1px 1px #ffffff35,0 7px 9px #0009;color:#eee;font-size:13px}
.tenant-tag small{color:#b9b7b2;font-size:10px}
.tenant-tag .pulse{background:#3bfa2f;box-shadow:0 0 0 2px #0a3508,0 0 10px #40f935}
#nav{padding:3px 18px 10px;display:block;overflow:auto;scrollbar-color:#5a4b30 #080a0b}
.nav-caption{display:none}
.nav-group+.nav-group{margin-top:0}
.nav-item{height:42px;margin:6px 0;padding:0 13px;gap:12px;border:1px solid #4d5358;background:linear-gradient(180deg,#303237 0%,#131517 42%,#08090b 100%);box-shadow:inset 0 1px 0 #a3a4a42a,0 3px 5px #000e,inset 0 -1px 1px #000;color:#f5f5f5;font-size:13px;font-weight:700;transition:transform .14s,border-color .14s}
.nav-item .ico{color:#f8c857;filter:drop-shadow(0 1px 1px #000) drop-shadow(0 0 2px #dba43277)}
.nav-item .ico svg{stroke-width:1.9;width:20px;height:20px}
.nav-item:hover:not(.active){background:linear-gradient(180deg,#4a4945,#202023 67%,#141414);border-color:#a88b51;transform:translateX(2px)}
.nav-item.active{border-color:#ff3845;color:#fff;background:linear-gradient(180deg,#ff3341 0%,#b4000d 38%,#750003 75%,#b7000a 100%);box-shadow:inset 0 2px 2px #ffb7aa99,inset 0 -2px 1px #5d0009,0 0 12px #e5001e7a,0 4px 9px #000}
.nav-item.active .ico{color:#ffe2a0;filter:drop-shadow(0 0 2px #ffd84f)}
.sidebar-foot{margin:auto 20px 18px;border-top:1px solid #5b584e;padding-top:13px;color:#c8c5c0;font-size:10px}
.sidebar-foot .side-foot-head{font-weight:650}
.sidebar-foot .dot-green{background:#34fa2f;box-shadow:0 0 7px #37fc36}
.sidebar-foot small{color:#c6c4bd;margin-left:4px;padding-top:7px}
.side-footer-brand{display:none}
.main{background:radial-gradient(ellipse at 50% -6%,#252421 0,transparent 38%),linear-gradient(155deg,#0b0d0e 0%,#050607 100%);position:relative}
.topbar{position:relative;height:59px;background:linear-gradient(180deg,#191b1e,#070809 90%);border-bottom:1px solid #cc902f;padding:0 32px;box-shadow:0 2px 6px #bb81243d,inset 0 1px 0 #ffffff13}
.topbar-left{font-size:14px;gap:20px;color:#d6d6d6}
.topbar-left .crumb{font-size:16px;font-weight:750;color:#f7f7f7}
.topbar-left #crumbCurrent{color:#e3e2e0}
.topbar .divider-v{width:2px;height:23px;background:linear-gradient(#ffe08a,#ae7226)}
.topbar-right{gap:20px;color:#eee;font-size:12px}
.mode-pill{color:#f8ce65;background:linear-gradient(#080808,#181510);border:1px solid #ffc129;box-shadow:inset 0 0 4px #fccc5133,0 0 7px #e8b63a1e;border-radius:24px;font-size:11px;letter-spacing:.4px;padding:8px 15px;font-weight:800}
.avatar,.help-top{background:linear-gradient(155deg,#56575c,#101114 70%);border:1px solid #858689;color:#fff;box-shadow:inset 0 1px 1px #fff4,0 3px 9px #000c;width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.help-top{width:30px;height:30px;font-size:16px;cursor:pointer}
.content{max-width:1740px;padding:20px 26px 65px}
.headline{min-height:125px;margin-bottom:17px;align-items:center;padding:10px 19px 14px 21px;border-left:4px solid #efbd4c;box-shadow:inset 2px 0 5px #ebbf6d33;position:relative}
.hero-home{border-left:0;background:radial-gradient(ellipse at 58% 10%,#7d582b26,transparent 30%),linear-gradient(90deg,#07080a 0%,#07080a 33%,#0c0d0d 64%,#080809 100%);overflow:hidden;box-shadow:inset 0 -1px 0 #a77d304d,0 4px 20px #0007}

async function writeCloudChanges(){
 if(cloudBusy)throw Error('Hay una operación guardándose. Inténtalo nuevamente.');
 cloudBusy=true;
 try{
  if(!originalData)throw Error('Inicia sesión antes de editar');
  const before=originalData;
  if(changed(state.settings,before.settings)) apiErr(await DB.from('bb_businesses').update({name:state.settings.businessName,open_min:state.settings.open,close_min:state.settings.close}).eq('id',businessId));
  for(const c of onlyChanged(state.clients,before.clients)){
   const obj={business_id:businessId,name:c.name,phone:'+1'+cleanPhone(c.phone),email:c.email||null,notes:c.notes||''};
   if(!before.clients.some(x=>x.id===c.id)) apiErr(await DB.from('bb_clients').insert({...obj,id:c.id}));
   else apiErr(await DB.from('bb_clients').update(obj).eq('business_id',businessId).eq('id',c.id));
  }
  for(const st of onlyChanged(state.staff,before.staff)){
   const obj={business_id:businessId,name:st.name,title:st.role,active:st.active};
   const prev=before.staff.find(x=>x.id===st.id);
   if(!prev)apiErr(await DB.from('bb_staff').insert({...obj,id:st.id}));
   else if(changed([st.name,st.role,st.active],[prev.name,prev.role,prev.active]))apiErr(await DB.from('bb_staff').update(obj).eq('id',st.id).eq('business_id',businessId));
   for(let i=0;i<7;i++){
    const now=st.schedule[i],old=prev?.schedule[i];
    if(changed(now,old))apiErr(await DB.from('bb_staff_hours').upsert({business_id:businessId,staff_id:st.id,day_of_week:i,enabled:now.on,start_min:now.start,end_min:now.end},{onConflict:'business_id,staff_id,day_of_week'}));
   }
  }
  for(const srv of onlyChanged(state.services,before.services)){
    const obj={business_id:businessId,name:srv.name,duration_min:srv.duration,buffer_min:srv.buffer,price_cents:Math.round(srv.price*100),active:srv.active};
    const prev=before.services.find(x=>x.id===srv.id);
    if(!prev)apiErr(await DB.from('bb_services').insert({...obj,id:srv.id}));
    else if(changed([srv.name,srv.duration,srv.buffer,srv.price,srv.active],[prev.name,prev.duration,prev.buffer,prev.price,prev.active]))apiErr(await DB.from('bb_services').update(obj).eq('id',srv.id).eq('business_id',businessId));
    const current=[...srv.staffIds].sort(),last=[...(prev?.staffIds||[])].sort();
    if(changed(current,last)){
       // Realizar primero borrados y luego inserciones; PK impide duplicaciones.
       for(const id of last.filter(x=>!current.includes(x)))apiErr(await DB.from('bb_service_staff').delete().eq('business_id',businessId).eq('service_id',srv.id).eq('staff_id',id));
       for(const id of current.filter(x=>!last.includes(x)))apiErr(await DB.from('bb_service_staff').insert({business_id:businessId,service_id:srv.id,staff_id:id}));
    }
  }
  for(const apt of onlyChanged(state.appointments,before.appointments)){
    const prev=before.appointments.find(x=>x.id===apt.id);
    const base={p_business:businessId,p_client:apt.clientId,p_staff:apt.employeeId,p_service:apt.serviceId,p_date:apt.date,p_start_min:apt.start,p_notes:apt.notes||'',p_status:statusDb[apt.status]};
    if(!prev){apiErr(await DB.rpc('bb_book_appointment',base));}
    else if(apt.status==='cancelada'&&prev.status!=='cancelada')apiErr(await DB.from('bb_appointments').update({status:'cancelled'}).eq('business_id',businessId).eq('id',apt.id));
    else if(changed([apt.clientId,apt.employeeId,apt.serviceId,apt.date,apt.start],[prev.clientId,prev.employeeId,prev.serviceId,prev.date,prev.start])){
       apiErr(await DB.rpc('bb_move_appointment',{...base,p_id:apt.id}));
    }else if(apt.status!==prev.status||apt.notes!==prev.notes)apiErr(await DB.from('bb_appointments').update({status:statusDb[apt.status],notes:apt.notes||''}).eq('business_id',businessId).eq('id',apt.id));
  }
  await cloudLoad();
 }catch(err){
  // Al no confirmar una operación se fuerza una recarga consistente en lugar de fingir éxito.
  try{await cloudLoad()}catch{state=deep(originalData);render();}
  throw err;
 }finally{cloudBusy=false;}
}

function renderDay(staff){if(!staff.length)return '<div class="empty">No hay empleados disponibles para mostrar.</div>';let open=state.settings.open,close=state.settings.close;let rows=[];for(let time=open;time<close;time+=STEP){rows.push(`<div class="cal-row" style="min-height:46px"><div class="cal-time">${clock(time)}</div>${staff.map(emp=>{let list=activeBookings(selectedDate,emp.id);let at=list.find(a=>a.start===time);let busy=appointmentsOn(selectedDate).filter(a=>a.employeeId===emp.id).find(a=>{if(a.status==='cancelada')return false;let srv=service(a.serviceId);return a.start<time&&time<a.start+(srv?.duration||30)+(srv?.buffer||0);});let sched=emp.schedule[weekday(selectedDate)];let disabled=selectedDate<today()||(selectedDate===today()&&time<ptr().min)||!sched?.on||time<sched.start||time>=sched.end;return `<div class="cal-cell">${at?`<button class="cal-chip ${at.status==='pendiente'?'pending':at.status==='cancelada'?'cancelled':''}" data-action="edit-apt" data-id="${at.id}" title="Ver o modificar cita"><strong>${esc(client(at.clientId)?.name||'Cliente')}</strong>${esc(service(at.serviceId)?.name||'Servicio')} · ${clock(at.start)}</button>`:busy?'<span class="mini-muted" style="opacity:.35">— ocupado —</span>':disabled?'<span class="mini-muted" style="opacity:.22">No disponible</span>':`<button class="cal-empty" data-action="slot" data-date="${selectedDate}" data-employee="${emp.id}" data-time="${time}" aria-label="Reservar ${clock(time)} con ${esc(emp.name)}">+ Reservar</button>`}</div>`;}).join('')}</div>`);}return `<div class="calendar" style="--cols:${staff.length}"><div class="cal-head"><div>Hora</div>${staff.map(x=>`<div>${esc(x.name)}</div>`).join('')}</div>${rows.join('')}</div>`;}
function renderWeek(staff){let start=startWeek(selectedDate);return `<div class="week">${Array.from({length:7},(_,i)=>{let date=move(start,i),a=appointmentsOn(date).filter(x=>staff.some(e=>e.id===x.employeeId)&&(statusFilter==='todas'||x.status===statusFilter));return `<section class="week-day"><header>${esc(formatDate(date,{weekday:'long',day:'numeric',month:'short'}))}${date===today()?'<small>Hoy</small>':''}</header>${a.map(x=>`<button class="week-item ${x.status==='pendiente'?'pending':x.status==='cancelada'?'cancelled':''}" data-action="edit-apt" data-id="${x.id}"><strong>${clock(x.start)}</strong><span>${esc(client(x.clientId)?.name)}</span><span>${esc(service(x.serviceId)?.name)}</span></button>`).join('')||'<p class="mini-muted">Sin citas</p>'}<button class="btn btn-ghost btn-sm" data-action="week-date" data-date="${date}">Ver día</button></section>`;}).join('')}</div>`;}
function clientStats(c){let a=state.appointments.filter(x=>x.clientId===c.id&&x.status!=='cancelada'),completed=a.filter(x=>x.date<=today());let last=completed.sort((x,y)=>y.date.localeCompare(x.date))[0];return {visits:completed.length,last:last?formatDate(last.date,{day:'numeric',month:'short',year:'numeric'}):'—',total:a.reduce((sum,x)=>sum+x.price,0)};}

function renderStaff(){let total=state.staff.filter(x=>x.active).length;return header('Empleados',`${total} empleados activos de ${state.staff.length}`,btn('+ Nuevo empleado','new-staff','btn-red'))+`<div class="staff-grid">${state.staff.map(e=>{let a=state.appointments.filter(x=>x.employeeId===e.id&&x.status!=='cancelada'),weekHours=e.schedule.filter(x=>x.on).reduce((v,x)=>v+(x.end-x.start)/60,0),works=state.services.filter(x=>x.staffIds.includes(e.id));return `<article class="surface staff-card"><div class="staff-top"><span class="personavatar">${esc(e.name.split(' ').slice(0,2).map(x=>x[0]).join(''))}</span><div style="flex:1"><div style="font-weight:750;font-size:14px">${esc(e.name)}</div><div class="mini-muted" style="margin-top:5px">${esc(e.role)}</div></div><span class="stat-pill" style="${e.active?'':'color:#ffb2bb;background:#392327;border-color:#6a343e'}">${e.active?'Activo':'Inactivo'}</span></div><ul class="staff-meta"><li>Horas por semana<strong>${weekHours} h</strong></li><li>Reservas registradas<strong>${a.length}</strong></li><li style="grid-column:1/-1">Servicios autorizados<strong style="font-size:12px;line-height:1.5">${esc(works.map(x=>x.name).join(' · ')||'Ninguno')}</strong></li></ul><div class="staff-acts"><button class="btn btn-sm" data-action="edit-staff" data-id="${e.id}">Editar horario</button><label class="toggle"><input type="checkbox" data-action="toggle-staff" data-id="${e.id}" ${e.active?'checked':''}> Activo</label></div></article>`;}).join('')}</div>`;}

function validateAppointment(a,ignoreId){if(!client(a.clientId))return 'Selecciona un cliente válido.';let e=employee(a.employeeId),s=service(a.serviceId);if(!e||!e.active)return 'El empleado no está disponible.';if(!s||!s.active)return 'El servicio no está activo.';if(!s.staffIds.includes(e.id))return 'Este empleado no realiza el servicio seleccionado.';if(a.start%15!==0)return 'Selecciona una hora en intervalos de 15 minutos.';if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||Number.isNaN(Date.parse(`${a.date}T12:00:00Z`)))return 'La fecha no es válida.';let now=ptr();if(a.date<now.date||(a.date===now.date&&a.start<now.min))return 'No se puede reservar una hora que ya pasó.';let end=a.start+s.duration+s.buffer;if(a.start<state.settings.open||end>state.settings.close||end>DAY)return 'La cita excede el horario de funcionamiento del negocio.';let working=e.schedule[weekday(a.date)];if(!working?.on)return 'El profesional no trabaja ese día.';if(a.start<working.start||end>working.end)return 'La cita excede el horario del empleado.';let conflict=state.appointments.some(b=>{if(b.id===ignoreId||b.status==='cancelada'||b.date!==a.date||b.employeeId!==a.employeeId)return false;let bs=service(b.serviceId);let bEnd=b.start+(bs?.duration||30)+(bs?.buffer||0);return a.start<bEnd&&b.start<end;});if(conflict)return 'El empleado ya tiene una cita que ocupa ese horario (incluido el buffer).';return null;}
async function processForm(form){let type=form.dataset.form,f=new FormData(form),val=k=>String(f.get(k)||'').trim(),id=modalData?.id;
if(type==='appointment'){
 let candidate={clientId:val('clientId'),serviceId:val('serviceId'),employeeId:val('employeeId'),date:val('date'),start:mins(val('start')),status:val('status'),notes:val('notes')};

 if(candidate.status!=='cancelada'){let unchanged=original&&original.status!=='cancelada'&&['clientId','serviceId','employeeId','date','start'].every(k=>original[k]===candidate[k]);let err=unchanged?null:validateAppointment(candidate,id);if(err)return errorModal(err);}else if(!original)return errorModal('No se pueden crear reservas canceladas.');
 let obj={...original,...candidate,id:id||uid(),price:service(candidate.serviceId)?.price||0};
 if(original)state.appointments=state.appointments.map(x=>x.id===id?obj:x);else state.appointments.push(obj);
 if(!(await save()))return;closeModal();render();notify(original?'Cita actualizada correctamente':'Cita creada en PostgreSQL');

 let name=val('name'),phone=cleanPhone(val('phone')),email=val('email');if(name.length<3)return errorModal('Escribe el nombre completo.');if(!/^(787|939)\d{7}$/.test(phone))return errorModal('El teléfono debe tener 10 dígitos y comenzar con 787 o 939.');if(state.clients.some(x=>x.phone===phone&&x.id!==id))return errorModal('Ya existe un cliente con este teléfono.');if(email&&!/^\S+@\S+\.\S+$/.test(email))return errorModal('El correo no es válido.');let previous=client(id),obj={id:id||uid(),name,phone,email,notes:val('notes'),created:previous?.created||today()};if(previous)state.clients=state.clients.map(x=>x.id===id?obj:x);else state.clients.push(obj);if(!(await save()))return;closeModal();render();notify(previous?'Cliente actualizado':'Cliente registrado');
}
if(type==='staff'){
 let name=val('name'),role=val('role');if(name.length<3||!role)return errorModal('Completa nombre y especialidad.');let schedule=[];for(let i=0;i<7;i++){let start=mins(val(`start-${i}`)),end=mins(val(`end-${i}`)),on=f.has(`day-${i}`);if(on&&(start>=end||start%STEP||end%STEP))return errorModal(`Corrige el horario de ${days[i]} (intervalos de 15 min).`);schedule.push({day:i,on,start,end});}
 let staffId=id||uid(),old=employee(id),obj={id:staffId,name,role,active:old?.active??true,schedule};if(old)state.staff=state.staff.map(x=>x.id===id?obj:x);else state.staff.push(obj);
 state.services.forEach(s=>{s.staffIds=s.staffIds.filter(x=>x!==staffId);if(f.has(`service-${s.id}`))s.staffIds.push(staffId);});if(!(await save()))return;closeModal();render();notify('Empleado y horario guardados');
}
if(type==='service'){
 let name=val('name'),duration=Number(val('duration')),buffer=Number(val('buffer')),price=Number(val('price')),active=val('active')==='true';if(name.length<3||!Number.isFinite(duration)||duration<15||duration>480||duration%15)return errorModal('Duración inválida (15–480 minutos, múltiplos de 15).');if(!Number.isFinite(buffer)||buffer<0||buffer>120||buffer%15)return errorModal('Buffer inválido (0–120 minutos, múltiplos de 15).');if(!Number.isFinite(price)||price<0||price>50000)return errorModal('El precio debe ser un valor válido.');let obj={id:id||uid(),name,duration,buffer,price,active,staffIds:state.staff.filter(e=>f.has(`staff-${e.id}`)).map(e=>e.id)};if(id)state.services=state.services.map(x=>x.id===id?obj:x);else state.services.push(obj);if(!(await save()))return;closeModal();render();notify('Servicio guardado');
}
if(type==='settings'){
 let businessName=val('businessName'),open=mins(val('open')),close=mins(val('close'));if(businessName.length<2)return notify('Escribe un nombre comercial válido',true);if(open>=close||open%15||close%15)return notify('El horario debe usar intervalos de 15 minutos y cierre posterior a apertura',true);state.settings={...state.settings,businessName,open,close};if(!(await save()))return;render();notify('Configuración guardada');
}
}
async function act(e){let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;if(action==='help-demo'){notify('SaaS conectado: tus datos se guardan en PostgreSQL. Pagos y WhatsApp aún no están conectados.');return;}
 if(action==='nav'){go(b.dataset.page);return;}
 if(action==='close-modal'){closeModal();return;}
 if(action==='new-apt'){showModal('appointment');return;}
 if(action==='new-apt-client'){showModal('appointment',{clientId:id});let el=$('#modal select[name="clientId"]');if(el)el.value=id;return;}
 if(action==='slot'){showModal('appointment',{date:b.dataset.date,employeeId:b.dataset.employee,start:Number(b.dataset.time)});return;}
 if(action==='edit-apt'){showModal('appointment',{id});return;}
 if(action==='cancel-apt'){if(!confirm('¿Cancelar esta cita?'))return;let ap=state.appointments.find(x=>x.id===id);if(ap){ap.status='cancelada';if(!(await save()))return;closeModal();render();notify('Cita cancelada');}return;}
 if(action==='new-client'){showModal('client');return;}
 if(action==='view-client'){showModal('client-view',{id});return;}
 if(action==='edit-client'){showModal('client',{id});return;}
 if(action==='new-staff'){showModal('staff');return;}
 if(action==='edit-staff'){showModal('staff',{id});return;}
 if(action==='toggle-staff'){let emp=employee(id);if(emp){emp.active=b.checked;if(!(await save()))return;render();notify(emp.active?'Empleado activado':'Empleado desactivado');}return;}
 if(action==='new-service'){showModal('service');return;}
 if(action==='edit-service'){showModal('service',{id});return;}
 if(action==='prev-day'){selectedDate=move(selectedDate,view==='semana'?-7:-1);render();return;}
 if(action==='next-day'){selectedDate=move(selectedDate,view==='semana'?7:1);render();return;}
 if(action==='today'){selectedDate=today();render();return;}
 if(action==='view-day'){view='dia';render();return;}
 if(action==='view-week'){view='semana';render();return;}
 if(action==='week-date'){selectedDate=b.dataset.date;view='dia';render();return;}
 if(action==='reset-demo'){notify('No se pueden restablecer datos de un negocio conectado.');return;}
}
function inputChanged(e){if(e.target.id==='search'){let value=e.target.value;search=value;let pos=e.target.selectionStart;render();let input=$('#search');input?.focus();input?.setSelectionRange(pos,pos);}if(e.target.id==='staffFilter'){staffFilter=e.target.value;render();}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render();}}
document.addEventListener('click',act);document.addEventListener('input',e=>{if(e.target.id==='search')inputChanged(e);});document.addEventListener('change',e=>{if(['staffFilter','statusFilter'].includes(e.target.id))inputChanged(e);});document.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();processForm(f);});$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&modalKind!=='auth')closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalKind&&modalKind!=='auth')closeModal();});window.addEventListener('hashchange',()=>{let id=location.hash.replace(/^#\//,'');if(navItems.some(x=>x[0]===id)){page=id;render();}});
let initial=location.hash.replace(/^#\//,'');if(navItems.some(x=>x[0]===initial))page=initial;
bootCloud();

function showGate(title,body){
 modalKind='auth';
 $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h2>${esc(title)}</h2><p>Barber & Beauty Pro · ARPRobots</p></div></div><div class="modal-body">${body}</div></div>`;
 $('#modal').classList.remove('hidden');
 document.body.style.overflow='hidden';
 $('#modal input')?.focus();
}
function authGate(message=''){
 const error=message?`<p class="form-error" style="display:block">${esc(message)}</p>`:'';
 showGate('Iniciar sesión',`${error}<form id="bbproLogin" class="form-grid"><label>Correo electrónico<input name="email" class="field" type="email" autocomplete="email" required></label><label>Contraseña<input name="password" class="field" type="password" autocomplete="current-password" required minlength="8"></label><div class="btnrow"><button class="btn btn-red" type="submit">Entrar</button><button class="btn btn-ghost" type="button" id="bbproRegister">Crear cuenta</button></div></form>`);
 $('#bbproLogin').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const result=await DB.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});apiErr(result);await cloudReady();}catch(err){authGate(err.message);}});
 $('#bbproRegister').addEventListener('click',()=>{window.location.assign((location.hostname.endsWith('.github.io')?'/arprobots-assets':'')+'/registro/');});
}
function registerGate(message=''){
 const error=message?`<p class="form-error" style="display:block">${esc(message)}</p>`:'';
 showGate('Crear cuenta',`${error}<form id="bbproRegisterForm" class="form-grid"><label>Correo electrónico<input name="email" class="field" type="email" required></label><label>Contraseña (mínimo 8 caracteres)<input name="password" class="field" type="password" minlength="8" required></label><div class="btnrow"><button class="btn btn-red" type="submit">Crear cuenta</button><button class="btn btn-ghost" type="button" id="bbproBack">Volver</button></div></form>`);
 $('#bbproBack').addEventListener('click',()=>authGate());
 $('#bbproRegisterForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await DB.auth.signUp({email:String(f.get('email')),password:String(f.get('password')),options:{emailRedirectTo:window.location.origin+window.location.pathname}});apiErr(r);if(r.data.session)await cloudReady();else authGate('Cuenta creada. Confirma el correo para iniciar sesión.');}catch(err){registerGate(err.message);}});
}
function businessGate(items=[],message=''){
 const error=message?`<p class="form-error" style="display:block">${esc(message)}</p>`:'';
 const selection=items.length?`<div style="display:grid;gap:8px;margin-bottom:18px">${items.map(m=>`<button class="btn btn-ghost" data-business="${m.business_id}">${esc(m.bb_businesses?.name||m.business_id)}</button>`).join('')}</div>`:'';
 showGate('Selecciona tu negocio',`${error}${selection}<form id="bbproBusiness" class="form-grid"><label>Nuevo negocio<input class="field" required name="name" placeholder="Ej. Barber Studio"></label><label>Enlace (sin espacios)<input class="field" required name="slug" pattern="[a-z0-9][a-z0-9-]{2,47}" placeholder="barber-studio"></label><div class="btnrow"><button class="btn btn-red" type="submit">Crear negocio</button><button class="btn btn-ghost" id="bbproLogout" type="button">Salir</button></div></form>`);
 $('#modal').querySelectorAll('[data-business]').forEach(button=>button.addEventListener('click',async()=>{businessId=button.dataset.business;try{await cloudLoad();closeModal()}catch(err){businessGate(items,err.message)}}));
 $('#bbproLogout').addEventListener('click',async()=>{await DB.auth.signOut();businessId=null;loggedUser=null;authGate()});
 $('#bbproBusiness').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await DB.rpc('bb_create_business',{p_name:String(f.get('name')),p_slug:String(f.get('slug'))});businessId=apiErr(r);await cloudLoad();closeModal();}catch(err){businessGate(items,err.message)}});
}
async function visibleBusinesses(){
 const platformResult=await DB.rpc('bb_is_platform_admin');const isPlatformAdmin=apiErr(platformResult);
 if(isPlatformAdmin){
  const businesses=apiErr(await DB.from('bb_businesses').select('id,name,slug').order('name'));
  return businesses.map(b=>({business_id:b.id,role:'platform_admin',active:true,bb_businesses:{name:b.name,slug:b.slug}}));
 }
 return apiErr(await DB.from('bb_memberships').select('business_id,role,active,bb_businesses(name,slug)').eq('user_id',loggedUser.id).eq('active',true));
}
async function cloudReady(){
 const {data:auth,error:authError}=await DB.auth.getUser();if(authError||!auth.user){authGate();return;}
 loggedUser=auth.user;
 const members=await visibleBusinesses();
 if(members.length===1){businessId=members[0].business_id;await cloudLoad();closeModal();}
 else businessGate(members);
}
async function bootCloud(){
 if(location.protocol==='file:'){showGate('Abre esta versión con servidor local','<p>Para iniciar sesión en Supabase Auth, abre <code>iniciar_mac.command</code> desde la carpeta principal o utiliza un servidor HTTP local. No abras <code>conectado.html</code> con <code>file://</code>.</p><p>La demostración original sigue disponible en <a href="index.html">index.html</a>.</p>');return;}
 if(!DB){showGate('Configuración pendiente','<p>Para activar la versión conectada, configura <code>cloud/config.js</code> con la URL y clave pública del proyecto exclusivo de Barber & Beauty Pro. La demo exacta permanece disponible en <a href="index.html">index.html</a>.</p>');return;}
 try{await cloudReady();}catch(err){authGate(err.message||'No se pudo iniciar sesión');}
 const avatar=document.querySelector('.avatar'); if(avatar){avatar.setAttribute('role','button');avatar.setAttribute('tabindex','0');const pickBusiness=async()=>{if(!DB||!loggedUser)return;businessGate(await visibleBusinesses());};avatar.addEventListener('click',pickBusiness);avatar.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pickBusiness();}});}
}
})();

</script>
